<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คุณกำลังออฟไลน์อยู่ - JadHor OS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f4ed; /* Warm cream */
      color: #16264c; /* Brand Navy */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid rgba(22, 38, 76, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      max-width: 400px;
      width: 90%;
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      background: #34508c; /* Navy */
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 10px 22px -8px #34508c;
    }
    svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 10px;
    }
    p {
      font-size: 14px;
      color: #525c75;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      background: #d4a548; /* Gold */
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 18px -6px #d4a548;
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.5M5 12.5a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M12 20h.01"></path>
      </svg>
    </div>
    <h1>การเชื่อมต่ออินเทอร์เน็ตขาดหาย</h1>
    <p>ระบบ JadHor OS ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ในขณะนี้ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตของคุณแล้วลองใหม่อีกครั้ง</p>
    <a href="javascript:window.location.reload(true);" class="btn">ลองใหม่อีกครั้ง</a>
  </div>
</body>
</html>
