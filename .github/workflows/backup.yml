      - name: Push dump to orphan "backups" branch
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git fetch origin backups 2>/dev/null || true
          if git show-ref --quiet refs/remotes/origin/backups; then
            git checkout -b backups origin/backups
          else
            git checkout --orphan backups
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p backups
          mv "backup_output/$FILENAME" "backups/$FILENAME"
          # เก็บย้อนหลังแค่ 30 ไฟล์ล่าสุด — เรียงตามชื่อไฟล์ (มี timestamp
          # อยู่แล้ว) แทน mtime เพราะ git checkout จะ reset mtime ไฟล์เก่า
          # ทุกไฟล์เป็น "เวลาเช็คเอาท์" ทำให้ไฟล์ dump ที่เพิ่งสร้างก่อนหน้า
          # ดูเก่ากว่าไฟล์เก่าที่เพิ่ง checkout แล้วโดนลบทิ้งไปเอง (bug เดิม)
          cd backups && ls -1 | sort | head -n -30 | xargs -r rm -- && cd ..
          git add backups
          if git diff --cached --quiet; then
            echo "ไม่มีข้อมูลใหม่ให้ commit วันนี้ ข้าม"
          else
            git commit -m "backup: $FILENAME" --quiet
            git push origin backups
          fi